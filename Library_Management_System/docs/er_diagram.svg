<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="570" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Library Management System - ER Diagram</text>

  <!-- relationships (drawn first, under boxes) -->
  <g stroke="#2f4f9d" stroke-width="2" fill="none">
    <!-- categories to books (1 to N) -->
    <line x1="270" y1="150" x2="350" y2="150"/>
    <!-- books to issues (1 to N) -->
    <line x1="590" y1="190" x2="650" y2="190"/>
    <!-- members to issues (1 to N) -->
    <line x1="780" y1="400" x2="780" y2="330"/>
  </g>
  <g font-size="13" font-weight="700" fill="#b91c1c">
    <text x="276" y="142">1</text><text x="334" y="142">N</text>
    <text x="596" y="182">1</text><text x="632" y="182">N</text>
    <text x="788" y="394">1</text><text x="788" y="348">N</text>
  </g>
  <g font-size="12" font-style="italic" fill="#374151" text-anchor="middle">
    <text x="310" y="172">has</text>
    <text x="620" y="212">borrowed in</text>
    <text x="835" y="368">makes</text>
  </g>

  <!-- categories -->
  <g>
    <rect x="40" y="90" width="230" height="110" rx="8" fill="#f8f9fc" stroke="#2f4f9d" stroke-width="2"/>
    <rect x="40" y="90" width="230" height="30" rx="8" fill="#2f4f9d"/>
    <text x="155" y="111" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">categories</text>
    <text x="54" y="144" font-size="13" fill="#1f2937"><tspan font-weight="700">PK</tspan>  id  INTEGER</text>
    <text x="54" y="168" font-size="13" fill="#1f2937">      name  TEXT  (UNIQUE)</text>
  </g>

  <!-- books -->
  <g>
    <rect x="350" y="70" width="240" height="210" rx="8" fill="#f8f9fc" stroke="#2f4f9d" stroke-width="2"/>
    <rect x="350" y="70" width="240" height="30" rx="8" fill="#2f4f9d"/>
    <text x="470" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">books</text>
    <g font-size="13" fill="#1f2937">
      <text x="364" y="124"><tspan font-weight="700">PK</tspan>  id  INTEGER</text>
      <text x="364" y="146">      isbn  TEXT  (UNIQUE)</text>
      <text x="364" y="168">      title  TEXT</text>
      <text x="364" y="190">      author  TEXT</text>
      <text x="364" y="212">      publisher, year</text>
      <text x="364" y="234"><tspan font-weight="700">FK</tspan>  category_id  -&gt; categories.id</text>
      <text x="364" y="256">      total_copies, available_copies</text>
    </g>
  </g>

  <!-- issues -->
  <g>
    <rect x="650" y="70" width="270" height="260" rx="8" fill="#f8f9fc" stroke="#2f4f9d" stroke-width="2"/>
    <rect x="650" y="70" width="270" height="30" rx="8" fill="#2f4f9d"/>
    <text x="785" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">issues</text>
    <g font-size="13" fill="#1f2937">
      <text x="664" y="124"><tspan font-weight="700">PK</tspan>  id  INTEGER</text>
      <text x="664" y="148"><tspan font-weight="700">FK</tspan>  book_id  -&gt; books.id</text>
      <text x="664" y="172"><tspan font-weight="700">FK</tspan>  member_id  -&gt; members.id</text>
      <text x="664" y="196">      issue_date  TEXT (ISO date)</text>
      <text x="664" y="220">      due_date  TEXT (ISO date)</text>
      <text x="664" y="244">      return_date  TEXT  (NULL until returned)</text>
      <text x="664" y="268">      fine  INTEGER  (Rs.)</text>
      <text x="664" y="292">      status  'issued' | 'returned'</text>
    </g>
  </g>

  <!-- members -->
  <g>
    <rect x="650" y="400" width="270" height="140" rx="8" fill="#f8f9fc" stroke="#2f4f9d" stroke-width="2"/>
    <rect x="650" y="400" width="270" height="30" rx="8" fill="#2f4f9d"/>
    <text x="785" y="421" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">members</text>
    <g font-size="13" fill="#1f2937">
      <text x="664" y="454"><tspan font-weight="700">PK</tspan>  id  INTEGER</text>
      <text x="664" y="476">      name, phone, address</text>
      <text x="664" y="498">      email  TEXT  (UNIQUE)</text>
      <text x="664" y="520">      join_date, status 'active'|'inactive'</text>
    </g>
  </g>

  <!-- users -->
  <g>
    <rect x="40" y="400" width="270" height="110" rx="8" fill="#f8f9fc" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="40" y="400" width="270" height="30" rx="8" fill="#6b7280"/>
    <text x="175" y="421" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">users (admin login)</text>
    <g font-size="13" fill="#1f2937">
      <text x="54" y="454"><tspan font-weight="700">PK</tspan>  id  INTEGER</text>
      <text x="54" y="476">      username  TEXT  (UNIQUE)</text>
      <text x="54" y="498">      password_hash, full_name</text>
    </g>
  </g>

  <text x="40" y="534" font-size="12" fill="#6b7280">users is standalone: it only authenticates librarians.</text>
  <text x="40" y="552" font-size="12" fill="#6b7280">issues is the junction table that resolves the books-members M:N relationship.</text>
</svg>
