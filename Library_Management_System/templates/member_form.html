{% extends "base.html" %}
{% block title %}{{ 'Add' if mode == 'add' else 'Edit' }} Member - Library Management System{% endblock %}
{% block content %}
<h1>{{ 'Register New Member' if mode == 'add' else 'Edit Member' }}</h1>
<form method="post" class="card form" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="form-grid">
    <label>Full Name *
      <input type="text" name="name" required value="{{ member.name or '' }}">
    </label>
    <label>Email *
      <input type="email" name="email" required value="{{ member.email or '' }}">
    </label>
    <label>Phone
      <input type="tel" name="phone" value="{{ member.phone or '' }}">
    </label>
    <label>Status
      <select name="status">
        <option value="active" {{ 'selected' if member.status != 'inactive' }}>Active</option>
        <option value="inactive" {{ 'selected' if member.status == 'inactive' }}>Inactive</option>
      </select>
    </label>
    <label class="full">Address
      <textarea name="address" rows="2">{{ member.address or '' }}</textarea>
    </label>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{ 'Register Member' if mode == 'add' else 'Save Changes' }}</button>
    <a class="btn btn-outline" href="{{ url_for('members') }}">Cancel</a>
  </div>
</form>
{% endblock %}
